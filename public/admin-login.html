<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0; url=/admin.html?login=1" />
    <title>管理员登录</title>
    <link rel="stylesheet" href="/styles.css?v=20260729-ui18" />
    <style>
      .login-page { width: min(470px, calc(100% - 32px)); margin: 0 auto; padding: 100px 0; }
      .login-card { padding: 30px; border: 1px solid var(--line-strong); border-radius: 14px; background: rgb(11 26 22 / 90%); box-shadow: var(--shadow); }
      .login-card h1 { margin: 0 0 10px; }
      .login-card p { color: var(--muted); line-height: 1.6; }
      .login-form { display: grid; gap: 16px; margin-top: 24px; }
      .login-error { min-height: 20px; color: var(--danger); font-size: 13px; }
      .login-footer { display: flex; justify-content: space-between; margin-top: 20px; font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <p class="eyebrow">EMBY ICONS / ADMINISTRATION</p>
        <h1>管理员登录</h1>
        <p>登录后才能访问正式库编辑、远程导入、审核和发布功能。</p>
        <form class="login-form" id="login-form">
          <label class="field"><span>管理员令牌</span><input id="admin-token" type="password" autocomplete="current-password" required autofocus /></label>
          <p class="login-error" id="login-error"></p>
          <button class="button button-primary" id="login-button" type="submit">登录管理员面板</button>
        </form>
        <div class="login-footer"><a href="/">返回主页</a><span>令牌不会写入 URL</span></div>
      </section>
    </main>
    <script type="module" src="/admin-login.js"></script>
  </body>
</html>
