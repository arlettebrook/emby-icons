<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="refresh" content="0; url=/admin.html#moderation" />
    <title>Emby 图标审核</title>
    <link rel="stylesheet" href="/styles.css?v=20260729-ui17" />
    <style>
      .review-page { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0; }
      .review-toolbar { display: flex; justify-content: space-between; gap: 14px; align-items: end; margin: 24px 0; }
      .review-toolbar .field { min-width: 180px; }
      .review-list { display: grid; gap: 12px; }
      .review-item { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px; border: 1px solid var(--line-strong); border-radius: 12px; background: rgb(11 26 22 / 88%); }
      .review-item img { width: 64px; height: 64px; object-fit: contain; border-radius: 9px; background: #07100e; }
      .review-item h2 { margin: 0 0 5px; font-size: 16px; }
      .review-item p { margin: 4px 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
      .review-actions { display: flex; gap: 8px; }
      .review-actions .danger { border-color: rgb(255 113 140 / 45%); color: var(--danger); }
      .review-status { color: var(--muted); }
      @media (max-width: 700px) { .review-item { grid-template-columns: 56px minmax(0, 1fr); } .review-item img { width: 52px; height: 52px; } .review-actions { grid-column: 1 / -1; } }
    </style>
  </head>
  <body>
    <main class="review-page">
      <p class="eyebrow">EMBY ICONS / MODERATION</p>
      <h1>待审核图标</h1>
      <div class="review-toolbar">
        <label class="field"><span>管理员令牌</span><input id="admin-token" type="password" autocomplete="current-password" /></label>
        <button class="button button-primary" id="load-button" type="button">加载待审核</button>
      </div>
      <p class="review-status" id="status">请输入管理员令牌。</p>
      <section class="review-list" id="review-list"></section>
      <p><a href="/admin.html">返回管理员面板</a></p>
    </main>
    <script type="module" src="/review.js"></script>
  </body>
</html>
