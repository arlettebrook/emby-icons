<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Emby Icons 图标库</title>
    <link rel="stylesheet" href="/styles.css?v=20260729-ui18" />
    <style>
      .home-page { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 70px; }
      .home-header { max-width: 780px; }
      .home-header .eyebrow { margin-bottom: 14px; color: #9ab7ad; font-family: inherit; font-size: 11px; font-weight: 650; letter-spacing: 0.1em; }
      .home-header h1 { margin: 0 0 10px; color: #eaf6f1; font-size: clamp(32px, 5.2vw, 52px); font-weight: 720; letter-spacing: -0.035em; line-height: 1.12; text-wrap: balance; }
      .home-header p { max-width: 640px; color: var(--muted); font-size: 14px; line-height: 1.7; }
      .home-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
      .home-stat { min-width: 135px; padding: 13px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); }
      .home-stat strong { display: block; color: var(--accent); font-size: 20px; }
      .home-stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
      .home-metadata { display: grid; grid-template-columns: minmax(150px, .35fr) minmax(0, 1fr); gap: 12px; margin-top: 14px; }
      .home-metadata-card { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); }
      .home-metadata-card > span { display: block; color: var(--muted); font: 11px "Cascadia Code", Consolas, monospace; text-transform: uppercase; }
      .home-metadata-card strong, .home-metadata-card p { display: block; margin-top: 6px; overflow-wrap: anywhere; line-height: 1.55; }
      .home-metadata-card p { color: var(--muted); }
      .home-toolbar { display: flex; align-items: center; gap: 12px; margin-top: 32px; }
      .home-search { flex: 1; min-width: 0; }
      .home-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
      .home-error { margin-top: 22px; padding: 15px; border: 1px solid rgb(255 113 140 / 38%); border-radius: 9px; color: var(--danger); }
      .home-empty { padding: 60px 20px; color: var(--muted); text-align: center; }
      .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 18px; }
      .icon-card { min-width: 0; padding: 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-soft); transition: border-color 160ms ease, transform 160ms ease; }
      .icon-card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
      .icon-card a { display: block; color: inherit; text-decoration: none; }
      .icon-card .home-icon-preview { width: 100%; height: 124px; }
      .icon-card img { display: block; width: 100%; height: 124px; object-fit: contain; border-radius: 8px; background: transparent; }
      .icon-card strong { display: block; margin-top: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .home-icon-meta { min-width: 0; display: flex; align-items: center; gap: 8px; margin-top: 5px; }
      .icon-card small { min-width: 0; flex: 1; display: block; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
      .home-copy-button { width: 32px; height: 32px; flex: 0 0 32px; }
      .home-copy-button.is-copied { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
      .home-load-more { display: block; min-width: 160px; margin: 18px auto 0; }
      .home-footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 34px; color: var(--muted); font-size: 13px; }
      @media (max-width: 680px) { .home-page { width: calc(100% - 28px); padding-top: 32px; } .home-header h1 { font-size: clamp(30px, 9vw, 42px); } .home-toolbar { align-items: stretch; flex-direction: column; } .home-count { white-space: normal; } .home-metadata { grid-template-columns: 1fr; } .icon-card .home-icon-preview, .icon-card img { height: 116px; } }
      @media (max-width: 420px) { .home-page { width: calc(100% - 20px); padding-top: 26px; } .home-header h1 { font-size: 29px; } .home-grid { grid-template-columns: 1fr; } }
    </style>
    <style>
      @media (max-width: 680px) {
        .home-page { width: calc(100% - 28px); padding-top: 28px; padding-bottom: 48px; }
        .home-header h1 { font-size: clamp(29px, 8.8vw, 40px); }
        .home-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .home-stat { min-width: 0; padding: 12px; }
        .home-metadata { gap: 8px; }
        .home-toolbar { width: 100%; min-width: 0; gap: 8px; margin-top: 26px; overflow: visible; }
        .home-search { width: 100%; min-width: 0; height: 44px; flex: 0 0 44px; box-sizing: border-box; }
        .home-search input { min-width: 0; width: 100%; font-size: 16px; }
        .home-count { display: block; width: 100%; }
        .home-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 14px; }
        .icon-card { padding: 10px; }
        .icon-card .home-icon-preview, .icon-card img { height: 112px; }
        .home-footer { align-items: flex-start; flex-direction: column; gap: 6px; margin-top: 26px; }
      }
      @media (max-width: 420px) {
        .home-page { width: calc(100% - 20px); padding-top: 24px; }
        .home-search { height: 42px; flex-basis: 42px; padding-inline: 10px; }
        .home-stats { grid-template-columns: 1fr 1fr; }
        .home-stat strong { font-size: 18px; }
        .home-stat span { font-size: 11px; }
        .home-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
        .icon-card { padding: 9px; }
        .icon-card .home-icon-preview, .icon-card img { height: 104px; }
        .icon-card strong { margin-top: 9px; font-size: 13px; }
        .home-copy-button { width: 30px; height: 30px; flex-basis: 30px; }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">E</div>
          <div>
            <h1>Emby Icons</h1>
            <p>Library control center</p>
          </div>
        </div>
        <div class="header-actions">
          <a class="button button-primary" href="/submit.html">提交图标</a>
          <a class="button button-secondary" href="/submission.html">查看提交状态</a>
          <button class="button button-primary" id="copy-library-button" type="button"><span class="button-icon" aria-hidden="true">⧉</span><span id="copy-library-label">复制图标库地址</span></button>
          <a class="button button-secondary" href="/admin.html">管理员登录</a>
        </div>
      </div>
    </header>
    <main class="home-page">
      <header class="home-header">
        <div>
          <p class="eyebrow">EMBY ICONS / PUBLIC LIBRARY</p>
          <h1>让你的 Emby 图标库保持清晰、有序。</h1>
          <p>编辑图标资料，实时预览图片。</p>
        </div>
      </header>
      <section class="home-stats" aria-label="图标库概览">
        <div class="home-stat"><strong id="home-total">0</strong><span>图标总数</span></div>
        <div class="home-stat"><strong>JSON</strong><span>公开格式</span></div>
      </section>
      <section class="home-metadata" aria-label="图标库信息">
        <div class="home-metadata-card"><span>name</span><strong id="home-meta-name">Emby Icons</strong></div>
        <div class="home-metadata-card"><span>description</span><p id="home-meta-description">浏览已发布的 Emby 图标，搜索、复制并使用图标地址。</p></div>
      </section>
      <section class="home-toolbar" aria-label="图标搜索">
        <label class="search-field home-search" for="home-search">
          <span aria-hidden="true">⌕</span>
          <input id="home-search" type="search" placeholder="搜索图标名称或 URL" autocomplete="off" />
        </label>
        <span class="home-count" id="home-count">正在加载…</span>
      </section>
      <p class="home-error" id="home-error" hidden></p>
      <section class="home-grid" id="home-grid" aria-live="polite"></section>
      <button class="button button-secondary home-load-more" id="home-load-more" type="button" hidden>加载更多图标</button>
      <p class="home-empty" id="home-empty" hidden>没有找到匹配的图标。</p>
      <footer class="home-footer"><span id="home-updated">数据来自公开图标库</span><span>公开图标库地址可使用上方按钮复制</span></footer>
    </main>
    <script type="module" src="/home.js"></script>
  </body>
</html>
