<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>提交 Emby 图标</title>
    <link rel="stylesheet" href="/styles.css?v=20260729-ui23" />
    <style>
      .standalone { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 64px; }
      .standalone-card { padding: 28px; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
      .standalone-card h1 { margin: 0 0 10px; }
      .standalone-card p { color: var(--muted); line-height: 1.6; }
      .standalone-form { display: grid; gap: 16px; margin-top: 24px; }
      .standalone-form textarea { min-height: 100px; resize: vertical; }
      .standalone-result { margin-top: 18px; padding: 14px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); line-height: 1.6; word-break: break-word; }
      .standalone-result.error { background: rgb(255 113 140 / 12%); color: var(--danger); }
      .standalone-links { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 18px; }
      .standalone-links a { text-decoration: none; }
      .credential-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .credential-note { display: block; margin-top: 10px; color: var(--muted); font-size: 12px; }
      .turnstile-box { min-height: 65px; }
      @media (max-width: 680px) { .standalone { width: calc(100% - 28px); padding: 32px 0 48px; } .standalone-card { padding: 22px 18px; } .standalone-form { gap: 14px; } .standalone-form .button { width: 100%; min-height: 44px; } .standalone-links { display: grid; grid-template-columns: 1fr; } .standalone-links .button { width: 100%; } }
      @media (max-width: 360px) { .standalone { width: calc(100% - 20px); } .standalone-card { padding-inline: 15px; } }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <a class="brand-block" href="/" aria-label="返回 Emby Icons 主页">
          <div class="brand-mark" aria-hidden="true">E</div>
          <div><h1>Emby Icons</h1><p>Library control center</p></div>
        </a>
        <div class="header-actions">
          <a class="button button-secondary" href="/">返回主页</a>
          <a class="button button-secondary" href="/submission.html">查看提交状态</a>
        </div>
      </div>
    </header>
    <main class="standalone">
      <section class="standalone-card">
        <p class="eyebrow">EMBY ICONS / COMMUNITY SUBMISSION</p>
        <h1>提交一个图标</h1>
        <p>提交内容会进入审核队列。审核通过后才会出现在公开图标库中。请使用图标的 HTTPS 直链。</p>
        <form class="standalone-form" id="submission-form">
          <label class="field"><span>图标名称</span><input id="name" name="name" maxlength="120" required autocomplete="off" /></label>
          <label class="field"><span>图标 URL</span><input id="url" name="url" type="url" maxlength="2048" placeholder="https://example.com/icon.png" required autocomplete="url" /></label>
          <label class="field"><span>补充说明（可选）</span><textarea id="note" name="note" maxlength="1000"></textarea></label>
          <div class="turnstile-box" id="turnstile-container"></div>
          <button class="button button-primary" id="submit-button" type="submit">提交审核</button>
        </form>
        <div class="standalone-result" id="result" hidden></div>
        <div class="standalone-links"><a class="button button-secondary" href="/">返回主页</a><a class="button button-primary" href="/submit.html">再次提交</a></div>
      </section>
    </main>
    <script>
      // Configure the public Turnstile site key here when TURNSTILE_SECRET_KEY is enabled.
      window.SUBMISSION_SITE_KEY = "0x4AAAAAAEA794ymUZPuWjYY";
    </script>
    <script type="module" src="/submit.js"></script>
  </body>
</html>
