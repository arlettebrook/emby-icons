<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>我的提交</title>
    <link rel="stylesheet" href="/styles.css?v=20260729-ui15" />
    <style>
      .standalone { width: min(820px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 64px; }
      .standalone-card { padding: 28px; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
      .standalone-card h1 { margin: 0 0 10px; }
      .standalone-card > p { color: var(--muted); line-height: 1.6; }
      .submission-list { display: grid; gap: 10px; margin-top: 24px; }
      .submission-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: rgb(7 16 14 / 72%); }
      .submission-card h2 { margin: 0 0 6px; font-size: 16px; }
      .submission-card p { margin: 4px 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
      .submission-status { color: var(--accent); }
      .submission-empty { margin-top: 24px; padding: 28px 16px; border: 1px dashed var(--line-strong); border-radius: 10px; color: var(--muted); text-align: center; }
      .submission-info { display: grid; gap: 9px; margin-top: 22px; padding: 16px; border-radius: 9px; background: var(--accent-soft); }
      .submission-info strong { color: var(--accent); }
      .submission-info span { overflow-wrap: anywhere; }
      .standalone-form { display: grid; gap: 16px; margin-top: 20px; }
      .standalone-form textarea { min-height: 100px; resize: vertical; }
      .submission-actions, .standalone-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      .standalone-links { justify-content: space-between; }
      .standalone-links a { text-decoration: none; }
      .standalone-result { margin-top: 18px; padding: 14px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); line-height: 1.6; }
      .standalone-result.error { background: rgb(255 113 140 / 12%); color: var(--danger); }
      @media (max-width: 680px) { .standalone { width: calc(100% - 28px); padding: 32px 0 48px; } .standalone-card { padding: 22px 18px; } .submission-card { grid-template-columns: 1fr; } .submission-actions, .standalone-links { display: grid; grid-template-columns: 1fr; } .submission-actions .button, .standalone-links .button { width: 100%; min-height: 44px; } .standalone-links { justify-content: flex-start; } }
      @media (max-width: 360px) { .standalone { width: calc(100% - 20px); } .standalone-card { padding-inline: 15px; } }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <a class="brand-block" href="/" aria-label="返回 Emby Icons 主页">
          <div class="brand-mark" aria-hidden="true">E</div>
          <div><h1>Emby Icons</h1><p>Library control center</p></div>
        </a>
        <div class="header-actions">
          <a class="button button-secondary" href="/">返回主页</a>
          <a class="button button-primary" href="/submit.html">提交新的图标</a>
        </div>
      </div>
    </header>
    <main class="standalone">
      <section class="standalone-card">
        <p class="eyebrow">EMBY ICONS / SUBMISSION STATUS</p>
        <h1>我的提交</h1>
        <p>当前浏览器会自动保存你的提交记录。你可以直接查看状态，待审核提交还可以修改或撤回。</p>
        <div class="submission-list" id="submission-list"></div>
        <div class="submission-empty" id="submission-empty" hidden>当前浏览器还没有保存的提交记录。提交图标后，这里会自动显示。</div>
        <div class="submission-info" id="submission-info" hidden></div>
        <form class="standalone-form" id="edit-form" hidden>
          <label class="field"><span>图标名称</span><input id="edit-name" maxlength="120" required /></label>
          <label class="field"><span>图标 URL</span><input id="edit-url" type="url" maxlength="2048" required /></label>
          <label class="field"><span>补充说明</span><textarea id="edit-note" maxlength="1000"></textarea></label>
          <div class="submission-actions">
            <button class="button button-primary" type="submit">保存修改</button>
            <button class="button button-secondary" id="withdraw-button" type="button">撤回提交</button>
          </div>
        </form>
        <div class="standalone-result" id="result" hidden></div>
        <div class="standalone-links"><a class="button button-primary" href="/submit.html">提交新的图标</a><a class="button button-secondary" href="/">返回主页</a></div>
      </section>
    </main>
    <script type="module" src="/submission.js"></script>
  </body>
</html>
